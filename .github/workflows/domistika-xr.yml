name: Domistika XR verification
on:
  pull_request:
    paths:
      - 'xr.html'
      - 'src/main.js'
      - 'src/styles.css'
      - 'src/xr/**'
      - 'tests/xr-*.test.mjs'
      - 'vite.config.js'
      - '.github/workflows/domistika-xr.yml'
  push:
    branches: [main]
    paths:
      - 'xr.html'
      - 'src/main.js'
      - 'src/styles.css'
      - 'src/xr/**'
      - 'tests/xr-*.test.mjs'
      - 'vite.config.js'
permissions:
  contents: read
jobs:
  xr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check src/xr/main.js
      - run: node --check src/xr/model.js
      - run: node --check src/xr/framefieldPreview.js
      - run: node --check src/xr/brushModel.js
      - run: node --check src/xr/brushStudio.js
      - run: node --check src/xr/openblueModel.js
      - run: node --check src/xr/openbluePreview.js
      - run: node --check src/xr/patternForge.js
      - run: node --check src/xr/objectLab.js
      - run: node --check src/xr/workshopModel.js
      - run: node --check src/xr/workshopRuntime.js
      - run: node --test tests/xr-pattern-forge-model.test.mjs tests/xr-pattern-forge-runtime.test.mjs tests/xr-pattern-forge-integration.test.mjs tests/xr-object-lab-model.test.mjs tests/xr-object-lab-runtime.test.mjs tests/xr-object-lab-integration.test.mjs tests/xr-workshop-model.test.mjs tests/xr-workshop-integration.test.mjs tests/xr-openblue-model.test.mjs tests/xr-connected-workbench.test.mjs tests/xr-brush-model.test.mjs tests/xr-brush-integration.test.mjs tests/xr-model.test.mjs tests/xr-integration.test.mjs tests/xr-framefield-preview.test.mjs tests/xr-bpc-integration.test.mjs tests/xr-bpc-animation.test.mjs tests/xr-framefield-euler-parity.test.mjs tests/xr-entry-link.test.mjs
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/xr.html
